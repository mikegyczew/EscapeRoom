services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:10000
      ConnectionStrings__DefaultConnection: Data Source=/app/data/escape-room.db
      DataProtection__KeysDirectory: /app/data/keys
    ports:
      - "5167:10000"
    volumes:
      - escape-room-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:10000
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  escape-room-data:
