services:
  - type: web
    name: escaperoom-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Resend__ApiKey
        sync: false
      - key: Resend__FromAddress
        sync: false
      - key: Resend__FrontendBaseUrl
        value: https://escaperoom-front.onrender.com

  - type: web
    name: escaperoom-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        value: https://escaperoom-xlzw.onrender.com
