services:
  - type: web
    name: escaperoom-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000

  - type: web
    name: escaperoom-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: escaperoom-api
          property: hostport
